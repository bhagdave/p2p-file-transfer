[package]
name = "p2p-file-transfer"
version = "0.1.0"
edition = "2021"

[dependencies]
libp2p = { version = "0.53", features = ["identify", "mdns", "noise", "tcp", "yamux", "quic", "macros", "tokio"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
rpassword = "7.3"
anyhow = "1"
futures = "0.3"
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
local-ip-address = "0.5"

[dev-dependencies]
tempfile = "3"
